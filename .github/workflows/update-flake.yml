name: Update flake

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update all flake inputs
        run: nix flake update

      - name: Check flake outputs
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Evaluate NixOS configurations
        run: |
          for host in laptop rpi; do
            nix eval --raw --no-update-lock-file \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            printf '\n'
          done

      - name: Open or update the dependency pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          branch=automation/update-flake
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add flake.lock
          git commit -m 'chore: update flake inputs'
          git push --force-with-lease origin "$branch"

          pr=$(gh pr list --base "$BASE_BRANCH" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title 'chore: update flake inputs' \
              --body 'Updates all flake inputs. Flake checks and laptop/Pi evaluations passed; full builds and deployments were not performed.'
          fi
