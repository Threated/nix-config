name: Update flake

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update all flake inputs
        run: |
          nix flake update
          cp flake.lock "$RUNNER_TEMP/updated-flake.lock"

      - name: Validate updated flake
        id: check
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/check-flake.sh 2>&1 | tee "$RUNNER_TEMP/flake-check.log"

      - name: Repair failed validation with Gemini
        if: steps.check.outcome == 'failure'
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPAIR_PROMPT: |
            The flake inputs in this NixOS repository were just updated, and
            validation failed. The failure log is provided on stdin.
            Diagnose the failure and make the smallest source changes needed
            to fix it. Inspect the repository and run Nix commands as needed.
            Preserve the updated flake.lock and its dependency revisions.
            Do not edit .github, disable checks, remove host configurations,
            or bypass failures. Do not commit, push, create PRs, or deploy.
            Validate your repair with: bash .github/scripts/check-flake.sh
            Finish with a brief explanation of the cause and your changes.
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY is missing'; exit 1; }
          npx --yes @google/gemini-cli@latest \
            --model gemini-4-hydrogen --approval-mode yolo --skip-trust \
            --prompt "$REPAIR_PROMPT" < "$RUNNER_TEMP/flake-check.log"

      - name: Validate repaired flake
        if: steps.check.outcome == 'failure'
        run: |
          git diff --exit-code HEAD -- .github
          cmp flake.lock "$RUNNER_TEMP/updated-flake.lock"
          bash .github/scripts/check-flake.sh

      - name: Open or update the dependency pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add --all -- flake.lock flake.nix hosts modules inputs
          if git diff --cached --quiet; then
            exit 0
          fi

          branch=automation/update-flake
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git -c core.hooksPath=/dev/null commit -m 'chore: update flake inputs'
          git push --force-with-lease origin "$branch"

          pr=$(gh pr list --base "$BASE_BRANCH" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title 'chore: update flake inputs' \
              --body 'Updates all flake inputs, including any Gemini repairs needed to pass validation. Flake checks and laptop/Pi evaluations passed; full builds and deployments were not performed.'
          fi
