[accessibility]
high_contrast = false
ui_scale = 1.0

[audio]
enable_overdrive = false
enable_sounds = false

[backdrop]
tint_intensity = 0.82999998144805431

[bar.main]
background_opacity = 0.099999997764825821
capsule = true
capsule_opacity = 0.90000000000000002
center = [ "clock" ]
end = [ "tray", "notifications", "caffeine", "brightness", "bluetooth", "volume", "battery", "session" ]
margin_edge = 4
margin_ends = 4
padding = 2
position = "top"
radius = 12
reserve_space = true
scale = 1.0
shadow = false
start = [ "workspaces", "launcher", "group:g1", "media" ]
thickness = 34
widget_spacing = 6

[[bar.main.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g1"
members = [ "sysmon_cpu", "sysmon_ram" ]
opacity = 0.89999997615814209
padding = 6.0

[brightness]
enable_ddcutil = false

[desktop_widgets]
enabled = false

[dock]
active_monitor_only = false
auto_hide = true
background_opacity = 1.0
enabled = true
icon_size = 48
inactive_opacity = 0.59999999999999998
launcher_position = "none"
pinned = []
position = "bottom"
reserve_space = false
shadow = false
show_dots = false

[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 660

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1800

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 600

[lockscreen]
blur_intensity = 0.0
blurred_desktop = false
enabled = true
tint_intensity = 0.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 70.0
box_width = 400.0
cx = 1280.0
cy = 1321.0
output = "HDMI-A-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_password_hint = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 400.0
cx = 854.0
cy = 948.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_password_hint = true

[nightlight]
enabled = false

[notification]
background_opacity = 1.0
border = false
enable_daemon = true
layer = "overlay"
position = "top_right"

[osd]
background_opacity = 1.0
border = false
enabled = true
position = "top_right"

[shell]
avatar_path = "/home/threated/.face"
clipboard_enabled = false
corner_radius_scale = 1.0
date_format = "%a, %b %d"
font_family = "Sans Serif"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true
setup_wizard_enabled = false
telemetry_enabled = false
time_format = "{:%H:%M}"

[shell.animation]
enabled = false
speed = 1.0

[shell.greeter_sync]
auto_sync = false

[shell.launcher]
app_grid = false
categories = false
compact = false
show_icons = true
sort_by_usage = true

[shell.panel]
borders = false
control_center_placement = "attached"
launcher_placement = "centered"
open_near_click_control_center = true
session_placement = "centered"
shadow = false
transparency_mode = "solid"

[shell.screen_corners]
enabled = false

[shell.shadow]
alpha = 0.0

[system.monitor]
cpu_poll_seconds = 2.0
enabled = true
memory_poll_seconds = 2.0

[theme]
custom_palette = "Ghostty"
mode = "dark"
source = "custom"

[weather]
enabled = false

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
font_weight = 700
format = "{:%H:%M}"
scale = 0.85000000000000009
tooltip_format = "{:%H:%M %A, %B %d}"

[widget.launcher]
enabled = false

[widget.media]
hide_when_no_media = true

[widget.sysmon_cpu]
display = "text"
font_family = "JetBrainsMono NF"
stat = "cpu_usage"
type = "sysmon"

[widget.sysmon_ram]
display = "text"
font_family = "JetBrainsMono NF"
stat = "ram_used"
type = "sysmon"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
display = "id"
enable_scroll = true
hide_empty_workspaces = false
